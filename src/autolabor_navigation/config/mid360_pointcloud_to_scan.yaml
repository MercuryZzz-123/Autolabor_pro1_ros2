pointcloud_to_scan_node:
  ros__parameters:
    cloud_topic: "/livox/lidar"
    scan_topic: "/scan"
    target_frame: "base_link"
    output_frame: ""
    transform_timeout: 0.05

    min_height: -0.10
    max_height: 0.35
    angle_min: -180.0
    angle_max: 180.0
    angle_increment: 0.5
    scan_time: 0.1
    range_min: 0.3
    range_max: 30.0
    use_inf: true
